<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Mayank Ranjan | Developer Portfolio</title>
  <desc id="desc">Mayank Ranjan. Building thoughtful software, backed by evidence. Computer Science undergraduate in Pune.</desc>
  <defs>
    <clipPath id="round"><rect width="1200" height="320" rx="18"/></clipPath>
    <style>
      text { font-family: 'Segoe UI', Arial, Helvetica, sans-serif; }
      .eyebrow { font-size:15px; font-weight:700; letter-spacing:3.4px; fill:#A8B1AE; }
      .name { font-size:68px; font-weight:800; letter-spacing:-1.9px; fill:#F5F3EE; }
      .subtitle { font-size:25px; font-weight:500; fill:#D8DFD9; }
      .typing { font:500 17px Consolas, Menlo, monospace; fill:#93ADC7; }
      .tiny { font:700 13px 'Segoe UI', Arial, sans-serif; letter-spacing:2.0px; fill:#A8B1AE; }
      .panelHead { font:800 20px 'Segoe UI', Arial, sans-serif; fill:#F5F3EE; letter-spacing:1px; }
      .panelSub { font:600 12px 'Segoe UI', Arial, sans-serif; fill:#A8B1AE; letter-spacing:1px; }
      .route { stroke-dasharray:5 10; animation: move 5s linear infinite; }
      .cursor { animation: blink 1.2s steps(1) infinite; }
      .breathe { animation: breathe 3.5s ease-in-out infinite; }
      .b2 { animation-delay:1.2s; } .b3 { animation-delay:2.4s; }
      @keyframes move { to { stroke-dashoffset:-60; } }
      @keyframes blink { 50% { opacity:0; } }
      @keyframes breathe { 0%,100% { opacity:.60; } 50% { opacity:1; } }
      @media (prefers-reduced-motion: reduce) { .route,.cursor,.breathe {animation:none!important;} }
    </style>
  </defs>
  <g clip-path="url(#round)">
    <rect width="1200" height="320" fill="#171D22"/>
    <rect x="0" y="0" width="12" height="320" fill="#B7C8AA"/>
    <path d="M680 20 V300" stroke="#3A4548" stroke-width="1"/>
    <rect x="65" y="45" width="31" height="5" rx="2.5" fill="#B7C8AA"/>
    <rect x="100" y="45" width="12" height="5" rx="2.5" fill="#D7A98A"/>
    <text class="eyebrow" x="64" y="91">HELLO, I'M</text>
    <text class="name" x="61" y="160">Mayank Ranjan</text>
    <text class="subtitle" x="65" y="201">Building thoughtful software,</text>
    <text class="subtitle" x="65" y="234">backed by evidence.</text>
    <text class="typing" x="65" y="274">&gt; explore · experiment · engineer<tspan class="cursor" fill="#B7C8AA">_</tspan></text>

    <!-- Flat, animated engineering workflow illustration -->
    <g transform="translate(720,39)">
      <text class="tiny" x="8" y="16">HOW I WORK</text>
      <path class="route" d="M100 79 H171 Q193 79 193 101 V129 H248 Q266 129 266 151 V177 H328" fill="none" stroke="#B7C8AA" stroke-width="2" opacity=".68"/>
      <g class="breathe">
        <rect x="5" y="45" width="154" height="91" rx="12" fill="#20282D" stroke="#43514C"/>
        <rect x="19" y="59" width="26" height="5" rx="2.5" fill="#B7C8AA"/>
        <text class="panelHead" x="18" y="102">BUILD</text>
        <text class="panelSub" x="18" y="121">01  /  CREATE</text>
      </g>
      <g class="breathe b2">
        <rect x="164" y="94" width="149" height="91" rx="12" fill="#20282D" stroke="#465565"/>
        <rect x="178" y="108" width="26" height="5" rx="2.5" fill="#93ADC7"/>
        <text class="panelHead" x="177" y="151">TEST</text>
        <text class="panelSub" x="177" y="170">02  /  VERIFY</text>
      </g>
      <g class="breathe b3">
        <rect x="315" y="143" width="145" height="91" rx="12" fill="#20282D" stroke="#5D5249"/>
        <rect x="329" y="157" width="26" height="5" rx="2.5" fill="#D7A98A"/>
        <text class="panelHead" x="328" y="200">SHIP</text>
        <text class="panelSub" x="328" y="219">03  /  IMPROVE</text>
      </g>
      <circle cx="109" cy="79" r="4" fill="#B7C8AA"/>
      <circle cx="263" cy="129" r="4" fill="#93ADC7"/>
      <circle cx="328" cy="177" r="4" fill="#D7A98A"/>
    </g>
  </g>
</svg>
